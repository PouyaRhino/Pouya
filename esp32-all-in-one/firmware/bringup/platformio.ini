; Bring-up / hardware test firmware for the ESP32-S3 desk pet.
; Pins live in include/pins.h (single source of truth, mirrors docs/03-pinmap-power.md).

[env:deskpet-s3-n16r8]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16 MB QIO flash + 8 MB octal (OPI) PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = native USB, frees GPIO43/44

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
  lovyan03/LovyanGFX@1.1.16
  ncmreynolds/ld2410@0.1.3
  adafruit/Adafruit AHTX0@2.0.5
  adafruit/Adafruit BMP280 Library@2.6.8
  claws/BH1750@1.3.0
  adafruit/Adafruit NeoPixel@1.12.3
